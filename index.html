<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#243b6b"><link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png"><title>我的帳本</title>
<style>
:root{--exp:#c62828;--inc:#1b8a5a;--bg:#f2f4f7;--card:#fff;--ink:#1b2333;--sub:#6b7586;--line:#e4e8ee;--up:#d4352c;--down:#168a58;--acc:#243b6b;--soft:#e6ebf5;--tr:#7c4dcc}
@media(prefers-color-scheme:dark){:root{--exp:#ff6b61;--inc:#3fcf8e;--bg:#10141c;--card:#1a202b;--ink:#eef1f6;--sub:#8c97a9;--line:#2a3240;--up:#ff6b61;--down:#3fcf8e;--acc:#8fa9e6;--soft:#243049;--tr:#b388ff}}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px "Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;overflow:hidden;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}
main{flex:1;overflow-y:auto;padding:16px}.tab{display:none}.tab.on{display:block}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px}
h2{font-size:13px;font-weight:500;color:var(--sub);margin-bottom:8px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.top b{font-size:18px}
.top>span{display:flex;align-items:center;gap:6px;white-space:nowrap}
.ico{background:none;border:1px solid var(--line);color:var(--sub);border-radius:10px;padding:6px 9px;font:inherit;font-size:13px}
.hero{background:var(--acc);color:#fff;border-radius:20px;padding:20px;margin-bottom:12px}
@media(prefers-color-scheme:dark){.hero{color:#10141c}}
.hero small{opacity:.75}.big{font-size:40px;font-weight:700;margin:2px 0 12px}
.leg{display:flex;justify-content:space-between;font-size:13px;flex-wrap:wrap;gap:4px}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.row:first-child{border:0}
.row small{display:block;color:var(--sub);font-size:12px}.l{display:flex;align-items:center;gap:10px}.dot{width:10px;height:10px;border-radius:50%}
.inc{color:var(--inc)}.exp{color:var(--exp)}.neg{color:var(--exp)}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;color:var(--sub);font:inherit;padding:9px;border-radius:10px}.seg button.on{background:var(--card);color:var(--ink);font-weight:700}
.amt{text-align:center;font-size:42px;font-weight:700;margin:4px 0 10px}.amt span{font-size:18px;color:var(--sub)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{border:1.5px solid var(--kc,var(--line));background:var(--card);color:var(--kc,var(--ink));font:inherit;font-size:13px;font-weight:600;padding:7px 12px;border-radius:20px}
.chip.on{background:var(--kc);color:#fff}@media(prefers-color-scheme:dark){.chip.on{color:#10141c}}
#cats[data-k="支出"]{--kc:var(--exp)}#cats[data-k="收入"]{--kc:var(--inc)}#cats[data-k="轉帳"]{--kc:var(--tr)}
.f{display:flex;gap:8px;margin-bottom:10px}.f>*{flex:1;min-width:0}
input,select{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:11px;font:inherit;width:100%}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.pad button{background:var(--card);border:0;color:var(--ink);font:inherit;font-size:22px;padding:12px 0;border-radius:14px}.pad button:active{background:var(--soft)}
.go{width:100%;border:0;background:var(--acc);color:#fff;font:inherit;font-weight:700;font-size:16px;padding:14px;border-radius:14px}
@media(prefers-color-scheme:dark){.go{color:#10141c}}.go:disabled{opacity:.5}
nav{display:flex;background:var(--card);border-top:1px solid var(--line)}
nav button{flex:1;border:0;background:none;color:var(--sub);font:inherit;font-size:12px;padding:10px 0 12px}nav b{display:block;font-size:20px;font-weight:400}nav .on{color:var(--acc);font-weight:700}
.toast{z-index:20;position:absolute;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;max-width:92%;text-align:center}.toast.show{opacity:1}
#setup{position:absolute;inset:0;background:var(--bg);z-index:9;padding:24px 16px;display:none;overflow:auto}#setup.on{display:block}
.empty{color:var(--sub);text-align:center;padding:14px 0;font-size:13px}
#kind [data-k="收入"]{color:var(--inc)}#kind [data-k="支出"]{color:var(--exp)}#kind [data-k="轉帳"]{color:var(--tr)}
#kind .on{color:#fff}@media(prefers-color-scheme:dark){#kind .on{color:#10141c}}
#kind .on[data-k="收入"]{background:var(--inc)}#kind .on[data-k="支出"]{background:var(--exp)}#kind .on[data-k="轉帳"]{background:var(--tr)}
.lb{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.hd h2{margin:0}
.recbody{display:none}.recbody.on{display:block}
#asheet{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:8;display:none;align-items:flex-end}#asheet.on{display:flex}
#asheet .pn{background:var(--card);width:100%;max-height:75%;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}#asheet .hd b{font-size:17px}
@supports (appearance:base-select){select,::picker(select){appearance:base-select}::picker(select){border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.18)}select option{padding:8px 10px;border-radius:8px}select option:checked{background:var(--soft)}}
#splash{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:linear-gradient(155deg,#2ee6c4 0%,#0a7cc0 32%,#0a3ab4 66%,#5b3fe8 100%);color:#fff;transition:opacity .45s}
#splash img{width:min(42vw,200px);border-radius:22%;box-shadow:0 14px 44px rgba(0,0,0,.35)}#splash b{font-size:22px;letter-spacing:3px}
</style></head><body><div id="app"><main>

<section class="tab on" id="t-home">
<div class="top"><b>資產總覽</b><span><small id="sync" style="color:var(--sub);margin-right:4px"></small><button class="ico" id="sy">同步</button><button class="ico" id="gear">設定</button><button class="ico" id="eye">隱藏</button></span></div>
<div class="hero"><small>總資產</small><div class="big" id="total">…</div><div class="leg"><span id="lB"></span><span id="lC"></span></div></div>
<div class="card"><h2>帳戶餘額（點一下看最近記錄）</h2><div id="accs"></div></div></section>

<section class="tab" id="t-add"><div class="top"><b>日常記帳</b><button class="ico" id="aClr">清除</button></div>
<div class="seg" id="kind"><button data-k="支出" class="on">支出</button><button data-k="收入">收入</button><button data-k="轉帳">轉帳</button></div>
<div class="f" style="align-items:center"><input type="date" id="date" style="flex:0 0 140px"><div class="amt" style="margin:0;font-size:34px;text-align:right"><span>NT$</span> <b id="av">0</b></div></div>
<div class="chips" id="cats"></div>
<div class="f"><select id="acc"></select><select id="acc2" style="display:none"></select></div>
<div class="f"><input id="note" placeholder="備註（選填）"></div>
<div class="pad" id="pad"></div><button class="go" id="go">記一筆</button>
<div class="card" style="margin-top:14px"><div class="hd"><h2>最近記錄</h2><button class="ico tg" data-t="rec">展開</button></div><div class="recbody" id="rec"></div></div></section>
</main>

<nav id="nav"><button class="on" data-t="home"><b>🏠</b>總覽</button><button data-t="add"><b>📒</b>記帳</button></nav>
<div id="asheet"><div class="pn"><div class="hd"><b id="at"></b><button class="ico" id="ax">關閉</button></div><div id="al"></div></div></div>
<div class="toast" id="toast"></div>
<div id="setup"><div class="top"><b>連線設定</b></div><div class="card"><h2>Apps Script 網址</h2><div class="f"><input id="cu" placeholder="https://script.google.com/macros/s/.../exec"></div><h2>密碼</h2><div class="f"><input id="ct" type="password" placeholder="你設定的 token"></div><p id="cm" class="neg" style="margin-bottom:10px;font-size:13px"></p><button class="go" id="cs">儲存並連線</button></div></div>
</div>
<div id="splash"><img src="icon-512.png" alt=""><b>我的帳本</b></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
// 你的 Apps Script 網址（沒有密碼 token 無法讀寫資料）
const DEFAULT_URL="https://script.google.com/macros/s/AKfycbzOosTeOIMbmh5nB6ASjLS9s02PzDsgVYutddYYyuybDZVNXD0HnCRBKhYIx4eDZT89/exec";
const st={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let cfg={url:st.get('url')||DEFAULT_URL,token:st.get('token')||''},D=null,R=null,kind='支出',cat='',amt='',busy=false,hid=st.get('hid')==='1';
// 分類按鈕（紅＝支出、綠＝收入、紫＝轉帳），和 Sheet「分類」欄的下拉選項一致
const CATS={支出:["飲食","日常","交通","醫療","房貸"],收入:["生活費","薪資","其他"],轉帳:["存款","繳卡費"]};
// 信用卡額度（選填）：填了就會在帳戶下方顯示「剩餘額度」，例如 {'國泰信用卡':130000}
const LIM={};
const H=t=>hid?'******':t,fmt=n=>(n<0?'-':'')+'NT$'+Math.abs(Math.round(n)).toLocaleString();
const today=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
function toast(t,ms){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),ms||1800)}
async function api(action,payload){
  const r=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:cfg.token,action,payload:payload||{}})});
  const j=await r.json();
  if(!j.ok){if(j.code===401)openSetup('密碼不正確，請重新輸入');throw new Error(j.error||'失敗')}
  return j.data}
async function load(){
  if(!cfg.url||!cfg.token){openSetup('');return}
  $('#sync').textContent='更新中…';
  try{[D,R]=await Promise.all([api('dashboard'),api('recent')]);$('#sync').textContent='已同步'}
  catch(e){$('#sync').textContent='未連線';toast(e.message==='Failed to fetch'?'連線失敗，請檢查網路':e.message,3000)}
  render()}
setTimeout(()=>hideSplash(),5000);
function hideSplash(){const e=$('#splash');if(e){e.style.opacity=0;setTimeout(()=>e.remove(),450)}}
// 轉帳在 Sheet 是兩列（支出+收入），這裡合併成一筆顯示
function mergeRec(a){const o=[],TC=CATS.轉帳;for(let i=0;i<a.length;i++){const x=a[i],y=a[i+1];
  if(y&&TC.includes(x.category)&&x.type==='收入'&&y.type==='支出'&&y.category===x.category&&y.date===x.date&&y.amount===x.amount){o.push({...x,transfer:true,from:y.account,to:x.account});i++}else o.push(x)}return o}
const recRow=r=>r.transfer
  ?`<div class="row"><div>${r.category}<small>${r.date} · ${r.from} → ${r.to}${r.note?' · '+r.note:''}</small></div><b style="color:var(--tr)">${r.amount.toLocaleString()}</b></div>`
  :`<div class="row"><div>${r.category}<small>${r.date} · ${r.account}${r.note?' · '+r.note:''}</small></div><b class="${r.type==='收入'?'inc':'exp'}">${r.type==='收入'?'+':'-'}${r.amount.toLocaleString()}</b></div>`;
function render(){hideSplash();
  if(!D)return;
  const A=[...D.accounts.filter(a=>a.type==='bank'),...D.accounts.filter(a=>a.type==='card')],sum=t=>A.filter(a=>a.type===t).reduce((s,a)=>s+a.balance,0),bank=sum('bank'),card=sum('card'),tot=bank+card;
  $('#total').textContent=H(fmt(tot));$('#lB').textContent='銀行 '+H(fmt(bank));$('#lC').textContent='信用卡 '+H(fmt(card));
  const col={bank:'#f0a06a',card:'#5aa7e0'},lab={bank:'銀行',card:'信用卡'};
  $('#accs').innerHTML=A.map(a=>`<div class="row" data-a="${a.name}" style="cursor:pointer"><div class="l"><i class="dot" style="background:${col[a.type]}"></i><div>${a.name}<small>${lab[a.type]}${LIM[a.name]?' · 剩餘額度 '+H(fmt(LIM[a.name]+a.balance)):''}</small></div></div><b class="${!hid&&a.balance<0?'neg':''}">${H(fmt(a.balance))}</b></div>`).join('')||'<div class="empty">資產總覽的 A 欄還沒有帳戶</div>';
  ['acc','acc2'].forEach((id,i)=>{const e=$('#'+id),v=e.value;e.innerHTML='<option value="">'+(i?'轉入帳戶':kind==='轉帳'?'轉出帳戶':'帳戶')+'</option>'+A.map(a=>`<option style="color:${col[a.type]}">${a.name}</option>`).join('');e.value=v;colorSel(e)});
  if(R)$('#rec').innerHTML=mergeRec(R.expenses).slice(0,5).map(recRow).join('')||'<div class="empty">還沒有記錄</div>'}
async function send(btn,action,payload,after){
  if(busy)return;busy=true;btn.disabled=true;const t=btn.textContent;btn.textContent='處理中…';
  try{const d=await api(action,payload);after&&after(d);await load()}catch(e){toast('失敗：'+e.message,3500)}finally{busy=false;btn.disabled=false;btn.textContent=t}}
function drawCats(){$('#cats').dataset.k=kind;$('#cats').innerHTML=CATS[kind].map(c=>`<button class="chip${c===cat?' on':''}" data-c="${c}">${c}</button>`).join('')}
function setKind(k){kind=k;cat='';$$('#kind button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));$('#acc2').style.display=k==='轉帳'?'':'none';drawCats();render()}
function clearAdd(){amt='';cat='';$('#av').textContent='0';$('#note').value='';$('#date').value=today;$('#acc').value='';$('#acc2').value='';setKind('支出')}
$('#kind').onclick=e=>e.target.dataset.k&&setKind(e.target.dataset.k);
$('#cats').onclick=e=>{if(e.target.dataset.c){cat=e.target.dataset.c;drawCats()}};
$('#pad').innerHTML=['1','2','3','4','5','6','7','8','9','清除','0','⌫'].map(k=>`<button data-k="${k}">${k}</button>`).join('');
$('#pad').onclick=e=>{const k=e.target.dataset.k;if(!k)return;if(k==='清除')amt='';else if(k==='⌫')amt=amt.slice(0,-1);else if(amt.length<9)amt+=k;$('#av').textContent=amt?Number(amt).toLocaleString():'0'};
$('#go').onclick=function(){
  if(!Number(amt))return toast('請先輸入金額');if(!cat)return toast('請選擇分類');
  const a=$('#acc').value,b=$('#acc2').value;if(!a)return toast('請選擇帳戶');if(kind==='轉帳'&&!b)return toast('請選擇轉入帳戶');
  send(this,'addExpense',{date:$('#date').value,type:kind,category:cat,account:kind==='轉帳'?'':a,fromAccount:kind==='轉帳'?a:'',toAccount:b,amount:amt,note:$('#note').value},
  ()=>{toast('已記帳');amt='';cat='';$('#av').textContent='0';$('#note').value='';drawCats()})};
$('#aClr').onclick=clearAdd;
$('#nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;$$('nav button').forEach(x=>x.classList.toggle('on',x===b));$$('.tab').forEach(t=>t.classList.toggle('on',t.id==='t-'+b.dataset.t));$('main').scrollTop=0};
document.addEventListener('click',e=>{const b=e.target.closest('.tg');if(!b)return;const o=$('#'+b.dataset.t).classList.toggle('on');b.textContent=o?'收合':'展開'});
async function openAcct(name){
  if(hid)return toast('請先按「顯示」');
  $('#at').textContent=name;$('#al').innerHTML='<div class="empty">載入中…</div>';$('#asheet').classList.add('on');
  try{const d=await api('accountRecent',{account:name});
    $('#al').innerHTML=d.records.map(r=>`<div class="row"><div>${r.category}<small>${r.date} · ${r.type}${r.note?' · '+r.note:''}</small></div><b class="${r.type==='收入'?'inc':'exp'}">${r.type==='收入'?'+':'-'}${r.amount.toLocaleString()}</b></div>`).join('')||'<div class="empty">還沒有記錄</div>'}
  catch(e){$('#asheet').classList.remove('on');toast('失敗：'+e.message,3500)}}
$('#accs').onclick=e=>{const r=e.target.closest('[data-a]');if(r)openAcct(r.dataset.a)};
$('#asheet').onclick=e=>{if(e.target.id==='asheet'||e.target.id==='ax')$('#asheet').classList.remove('on')};
function colorSel(e){const o=e.selectedOptions[0];e.style.color=o&&o.style.color?o.style.color:''}
['acc','acc2'].forEach(i=>$('#'+i).addEventListener('change',e=>colorSel(e.target)));
function openSetup(m){hideSplash();$('#cu').value=cfg.url;$('#ct').value='';$('#cm').textContent=m||'';$('#setup').classList.add('on')}
$('#gear').onclick=()=>openSetup('');$('#sy').onclick=()=>{toast('同步中…',1000);load()};
$('#eye').textContent=hid?'顯示':'隱藏';$('#eye').onclick=()=>{hid=!hid;st.set('hid',hid?'1':'0');$('#eye').textContent=hid?'顯示':'隱藏';render()};
$('#cs').onclick=()=>{const u=$('#cu').value.trim(),t=$('#ct').value.trim();if(!u||!t)return($('#cm').textContent='網址和密碼都要填');cfg={url:u,token:t};st.set('url',u);st.set('token',t);$('#setup').classList.remove('on');load()};
$('#date').value=today;drawCats();load();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
